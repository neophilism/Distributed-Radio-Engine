version: 2.1

# Radio software contract and planning check plus scoped security record.
jobs:
  contract-and-plan:
    docker:
      - image: cimg/node:24.19.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Complete radio contract and regression suite
          command: npm run check
      - run:
          name: Independent roadmap validity check
          command: node scripts/check-roadmap.mjs
  security-status-record:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: E2EESA status integrity only (not security certification)
          command: python3 scripts/validate_e2eesa_status.py

workflows:
  required-verification:
    jobs:
      - contract-and-plan
      - security-status-record
